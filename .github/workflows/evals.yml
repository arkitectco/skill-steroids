name: Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doctor (pack checkout, no Cursor symlink)
        run: HOME="${RUNNER_TEMP:-/tmp}/ss-empty-home" ./plugin/skills/skill-steroids/scripts/doctor.sh
      - name: Test inventory dedupe
        run: ./tests/inventory/test-inventory.sh
      - name: Verify plugin manifests
        run: ./scripts/verify-plugin-manifests.sh
      - name: Test SessionStart hooks
        run: ./tests/hooks/test-session-start.sh
      - name: Run eval harness
        run: ./evals/run-eval.sh

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run test --workspace=@skillsteroids/web
